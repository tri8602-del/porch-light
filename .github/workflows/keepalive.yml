name: Keep check-ins running
# GitHub pauses scheduled workflows after 60 days with no repo activity. This re-enables the push schedule weekly.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/push.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
